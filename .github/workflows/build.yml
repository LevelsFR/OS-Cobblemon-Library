name: Build

on:
  push:
    branches:
      - "1.21.1/dev"
      - "1.21.1/main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify packaged mod metadata
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          FABRIC_JAR="fabric/build/libs/os-cobblemon-library-fabric-$VERSION.jar"
          NEOFORGE_JAR="neoforge/build/libs/os-cobblemon-library-neoforge-$VERSION.jar"
          ICON="icon.png"
          PACK_META="pack.mcmeta"
          PACK_ICON="pack.png"
          LICENSE_FILE="LICENSE"

          test -f "$FABRIC_JAR"
          test -f "$NEOFORGE_JAR"

          for JAR in "$FABRIC_JAR" "$NEOFORGE_JAR"; do
            jar tf "$JAR" | grep -Fxq "$ICON"
            jar tf "$JAR" | grep -Fxq "$PACK_META"
            jar tf "$JAR" | grep -Fxq "$PACK_ICON"
            jar tf "$JAR" | grep -Fxq "$LICENSE_FILE"
            unzip -p "$JAR" "$PACK_META" | grep -Fq '"pack_format": 48'
            unzip -p "$JAR" "$LICENSE_FILE" | grep -Fq 'OS Cobblemon Library Proprietary API License'
            unzip -p "$JAR" "$LICENSE_FILE" | grep -Fq 'Use of the Public API does not require an Independent Mod to disclose'
          done

          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"authors": ["LevelsFR"]'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"icon": "icon.png"'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'authors="LevelsFR"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'logoFile="icon.png"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

      - name: Verify Maven publication
        run: ./gradlew publishAllToMavenLocal --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-fabric
          path: |
            fabric/build/libs/*-fabric-*.jar
            !fabric/build/libs/*-dev-*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-neoforge
          path: |
            neoforge/build/libs/*-neoforge-*.jar
            !neoforge/build/libs/*-dev-*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
