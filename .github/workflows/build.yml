name: Build

on:
  push:
    branches:
      - "1.21.1/dev"
      - "1.21.1/main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_matrix:
    name: build matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cobblemon:
          - version: "1.8.2"
            coordinate: "1.8.2+1.21.1"
          - version: "1.8.3"
            coordinate: "1.8.3+1.21.1"
          - version: "1.8.4"
            coordinate: "1.8.4+1.21.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Protect repository infrastructure
        if: github.event_name == 'pull_request' && github.actor != 'LevelsFR'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          page=1
          while true; do
            response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"

            filenames="$(jq -r '.[].filename' <<< "$response")"

            if grep -Eq '^(site/|\.github/CODEOWNERS$|\.github/workflows/pages\.yml$|\.github/workflows/build\.yml$)' <<< "$filenames"; then
              echo "::error::Wiki and wiki-protection files may only be changed by LevelsFR."
              exit 1
            fi

            count="$(jq 'length' <<< "$response")"
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Verify bounded Gradle retry behavior
        run: bash scripts/test-gradle-retry.sh

      - name: Build and run tests
        env:
          COBBLEMON_VERSION: ${{ matrix.cobblemon.coordinate }}
        run: bash scripts/retry-gradle-transient.sh ./gradlew "-Pcobblemon_version=$COBBLEMON_VERSION" clean build --stacktrace

      - name: Verify packaged mod metadata
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          FABRIC_JAR="fabric/build/libs/os-cobblemon-library-fabric-$VERSION.jar"
          NEOFORGE_JAR="neoforge/build/libs/os-cobblemon-library-neoforge-$VERSION.jar"
          ICON="icon.png"
          PACK_META="pack.mcmeta"
          PACK_ICON="pack.png"
          LICENSE_FILE="LICENSE"

          test -f "$FABRIC_JAR"
          test -f "$NEOFORGE_JAR"

          for JAR in "$FABRIC_JAR" "$NEOFORGE_JAR"; do
            jar tf "$JAR" | grep -Fxq "$ICON"
            jar tf "$JAR" | grep -Fxq "$PACK_META"
            jar tf "$JAR" | grep -Fxq "$PACK_ICON"
            jar tf "$JAR" | grep -Fxq "$LICENSE_FILE"
            unzip -p "$JAR" "$PACK_META" | grep -Fq '"pack_format": 48'
            unzip -p "$JAR" "$LICENSE_FILE" | grep -Fq 'OS Cobblemon Library Proprietary API License'
            unzip -p "$JAR" "$LICENSE_FILE" | grep -Fq 'Use of the Public API does not require an Independent Mod to disclose'
          done

          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"authors": ["LevelsFR"]'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"icon": "icon.png"'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'authors="LevelsFR"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'logoFile="icon.png"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

      - name: Verify NeoForge mixin at runtime
        if: matrix.cobblemon.version == '1.8.4'
        env:
          COBBLEMON_VERSION: ${{ matrix.cobblemon.coordinate }}
        shell: bash
        run: |
          run_mixin_smoke() {
            local loader="$1" log_file status
            log_file="$(mktemp)"
            set +e
            timeout --signal=TERM --kill-after=15s 180s xvfb-run -a \
              ./gradlew "-Pcobblemon_version=$COBBLEMON_VERSION" ":$loader:runClient" --no-daemon --console=plain 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              echo "::error::The $loader runtime smoke exited with status $status."
              rm -f "$log_file"
              return "$status"
            fi
            if ! grep -Fq 'Installed the Cobblemon 1.8.2–1.8.4 ambient battle weather hook' "$log_file"; then
              echo "::error::The $loader runtime did not report successful ambient-weather mixin installation."
              rm -f "$log_file"
              return 1
            fi
            if grep -Eiq 'MixinApplyError|Critical injection failure|InjectionError|Failed to apply mixin|ModResolutionException|NoSuchMethodError|NoClassDefFoundError|Unable to install.*ambient battle weather hook|ambient battle weather hook is unavailable' "$log_file"; then
              echo "::error::The $loader runtime reported a mixin or class-loading failure."
              rm -f "$log_file"
              return 1
            fi
            rm -f "$log_file"
          }

          run_mixin_smoke neoforge

      - name: Verify Maven publication
        env:
          COBBLEMON_VERSION: ${{ matrix.cobblemon.coordinate }}
        run: bash scripts/retry-gradle-transient.sh ./gradlew "-Pcobblemon_version=$COBBLEMON_VERSION" publishAllToMavenLocal --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-fabric-cobblemon-${{ matrix.cobblemon.version }}
          path: |
            fabric/build/libs/*-fabric-*.jar
            !fabric/build/libs/*-dev-*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-neoforge-cobblemon-${{ matrix.cobblemon.version }}
          path: |
            neoforge/build/libs/*-neoforge-*.jar
            !neoforge/build/libs/*-dev-*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error

  build:
    name: build
    runs-on: ubuntu-latest
    needs: build_matrix
    if: always()
    steps:
      - name: Require all compatibility builds to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.build_matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
