name: Build

on:
  push:
    branches:
      - "1.21.1/dev"
      - "1.21.1/main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify Maven publication
        run: ./gradlew publishAllToMavenLocal --stacktrace

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-fabric
          path: |
            fabric/build/libs/*-fabric-*.jar
            !fabric/build/libs/*-dev-*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: os-cobblemon-library-neoforge
          path: |
            neoforge/build/libs/*-neoforge-*.jar
            !neoforge/build/libs/*-dev-*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
