name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release JARs
        run: gradle clean build --stacktrace

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fabric/build/libs/*-fabric-*.jar
            !fabric/build/libs/*-dev-*.jar
            !fabric/build/libs/*-sources.jar
            neoforge/build/libs/*-neoforge-*.jar
            !neoforge/build/libs/*-dev-*.jar
            !neoforge/build/libs/*-sources.jar
