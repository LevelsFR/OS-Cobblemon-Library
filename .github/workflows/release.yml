name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Validate release version
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "mod_version was not found in gradle.properties."
            exit 1
          fi

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "Refusing to release snapshot version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match mod_version $VERSION."
            exit 1
          fi

      - name: Build release JARs
        run: ./gradlew clean build --stacktrace

      - name: Stage final release JARs
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          mkdir -p release
          cp "fabric/build/libs/os-cobblemon-library-fabric-$VERSION.jar" release/
          cp "neoforge/build/libs/os-cobblemon-library-neoforge-$VERSION.jar" release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.jar
