name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Validate release version
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            echo "mod_version was not found in gradle.properties."
            exit 1
          fi

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "Refusing to release snapshot version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match mod_version $VERSION."
            exit 1
          fi

      - name: Build release JARs
        run: ./gradlew clean build --stacktrace

      - name: Verify packaged mod metadata
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          FABRIC_JAR="fabric/build/libs/os-cobblemon-library-fabric-$VERSION.jar"
          NEOFORGE_JAR="neoforge/build/libs/os-cobblemon-library-neoforge-$VERSION.jar"
          ICON="icon.png"
          PACK_META="pack.mcmeta"
          LICENSE_FILE="LICENSE"

          test -f "$FABRIC_JAR"
          test -f "$NEOFORGE_JAR"

          for JAR in "$FABRIC_JAR" "$NEOFORGE_JAR"; do
            jar tf "$JAR" | grep -Fxq "$ICON"
            jar tf "$JAR" | grep -Fxq "$PACK_META"
            jar tf "$JAR" | grep -Fxq "$LICENSE_FILE"
            unzip -p "$JAR" "$PACK_META" | grep -Fq '"pack_format": 48'
            unzip -p "$JAR" "$LICENSE_FILE" | grep -Fq 'Copyright (c) 2026 LevelsFR'
          done

          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"authors": ["LevelsFR"]'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq '"icon": "icon.png"'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'authors="LevelsFR"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'logoFile="icon.png"'
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -Fq 'A lightweight shared Cobblemon API and compatibility library'

      - name: Stage final release JARs
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          mkdir -p release
          cp "fabric/build/libs/os-cobblemon-library-fabric-$VERSION.jar" release/
          cp "neoforge/build/libs/os-cobblemon-library-neoforge-$VERSION.jar" release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.jar
